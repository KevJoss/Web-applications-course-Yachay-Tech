<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="preload" href="../css/main_styles.css" as="style">
    <link href="../css/main_styles.css" rel="stylesheet">
    <link rel="preload" href="../css/header_syles.css" as="style">
    <link href="../css/header_syles.css" rel="stylesheet">
    <title>Contact | KevJoss</title>
</head>

<body>
    <header>
        <div class="logo-name">KevJoss</div>

        <nav class="navigation-bar">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="pages/about.html">About</a></li>
                <li><a href="professional.html">Professional</a></li>
                <li><a href="extracurricular.html">Extracurricular</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="schedule.html">Schedule</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form>
            <p>
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" required>
            </p>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="dateofbirth">Date of birth</label>
                <input type="date" id="dateofbirth" name="dateofbirth" required>
            </p>
            <p>
                <label for="degree">Degree Program</label>
                <select id="degree" name="degree" required>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Data Science">Data Science</option>
                </select>
            </p>
            <p>
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="0">Leveling</option>
                    <option value="1">1st</option>
                    <option value="2">2nd</option>
                    <option value="3">3rd</option>
                    <option value="4">4th</option>
                    <option value="5">5th</option>
                    <option value="6">6th</option>
                    <option value="7">7th</option>
                    <option value="8">8th</option>
                    <option value="9">9th</option>
                    <option value="10">10th</option>
                </select>
            </p>
            <p>
                <label for="reason">Reason to contact</label>
                <select id="reason" name="reason" required>
                    <option value="question">Question</option>
                    <option value="comment">Comment</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="other">Other</option>
                </select>
            </p>
            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </p>
            <p>
                <label for="checkbox">I accept of treating my data in this website</label>
                <input type="checkbox" id="checkbox" name="checkbox" required>
            </p>
            <p>
                <button type="submit"> Send message</button>
            </p>
        </form>
    </main>
    <footer>
        <p>Created by Kevin Sanchez in Ecuador on August 2026</p>
    </footer>
</body>

</html>
